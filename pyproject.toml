[project]
name = "hydat-x"
version = "0.1.0"
description = "HYDAT-X — Independent Flood Prediction Benchmark (banc d'essai indépendant de contre-expertise)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "duckdb>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "polars>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Projet de scripts : ne pas tenter de construire/embarquer le package.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]