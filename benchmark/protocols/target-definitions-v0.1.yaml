definitions:

  - id: T1
    name: "dépassement de quantile haut de débit (flow threshold)"
    family: exceedance
    condition: "value > quantile(q, base)"
    parameters:
      q: [0.95, 0.99, 0.995, 0.999]
      base: [whole, refhalf]
    run_rule: jours consécutifs strictement au-dessus
    event: segment continu
    horizon: day
    note: "0.0 jamais > quantile haut ⇒ politique zéro sans impact sur este famille"

  - id: T2
    name: "dépassement d'un seuil absolu de crue (flood threshold)"
    family: absolute_threshold
    status: HUMAN_DECISION_REQUIRED
    reason: "HYDAT ne contient aucun seuil officiel d'alerte/inondation. Source externe (règlementaire) requise. Aucun événement T2 calculé."
    condition: "value > S_officiel"
  - id: T3
    name: "pic annuel extrême (peak exceedance)"
    family: annual_peak
    source: ANNUAL_INSTANT_PEAKS (PEAK_TYPE='H')
    condition: "pic annuel > quantile(q) de la distribution des pics (base)"
    parameters:
      q: [0.8, 0.9, 0.95]
      base: [whole, refhalf]
    event: "année × station à pic exceptionnel"
    horizon: hydrological_year

  - id: T4
    name: "persistance de dépassement (multi-day exceedance)"
    family: persistence
    condition: "run de ≥ N jours consécutifs où value > quantile(q, base)"
    parameters:
      q: [0.95, 0.99]
      N: [3, 5, 10]
      base: [whole, refhalf]
    event: "jour 1 si dans un run de longueur ≥ N"
    horizon: day

