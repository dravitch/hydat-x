# Vocabulaire commun (fixé)
common:
  observation: debit_moyen_journalier (m³/s), cellule jour×station publique
  valid_day_rule: "value > 0 OR symbol = 'D'"
  unit_event: run = segment de jours consécutifs vérifiant la condition
  target_semantics: binaire jour×station (1 si jour dans un run qualifié)
  threshold_information_time:
    whole-series: future_informed        # diagnostic/descriptif uniquement
    refhalf: historical_reference        # seuil = 1ère moitié du registre de la station
  horizon:
    day: ["T1", "T4"]
    hydrological_year: ["T3"]

